<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Sucursales</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* Ocultar botones e inputs al imprimir */
        @media print {
            .no-print, .btn, th:last-child, td:last-child { display: none !important; }
            body { padding: 0 !important; }
            .shadow-sm { box-shadow: none !important; border: none !important; }
        }
    </style>
</head>
<body class="p-4 bg-white">
    
    <!-- ÁREA DEL FORMULARIO (Basado en el diseño) -->
    <div class="border p-4 rounded shadow-sm mb-4 no-print">
        <h4 class="mb-3 text-secondary border-bottom pb-2">
           <i class="fas fa-building me-2"></i> Sucursales
        </h4>
        
        <form id="formSucursal" class="row g-3 align-items-end">
            <!-- ID Oculto para saber si estamos editando o creando -->
            <input type="hidden" id="idSucursal">
            
            <div class="col-md-4">
                <label class="form-label small text-muted mb-1">Nombre</label>
                <input type="text" class="form-control" id="nombre" placeholder="Ej. Sucursal Norte">
            </div>
            
            <div class="col-md-4">
                <label class="form-label small text-muted mb-1">Dirección</label>
                <input type="text" class="form-control" id="direccion" placeholder="Calle, Número, Colonia">
            </div>

            <div class="col-md-4">
                <label class="form-label small text-muted mb-1">Empresa Propietaria</label>
                <select class="form-select" id="idEmpresa">
                    <option value="">Seleccione una empresa...</option>
                    <!-- Llenado dinámico -->
                </select>
            </div>

            <!-- Botones del Formulario -->
            <div class="col-12 mt-4">
                <button type="button" class="btn btn-primary px-4 me-2" id="btnGuardar" data-permiso="Alta">Guardar</button>
                <button type="button" class="btn btn-danger px-4 me-2 d-none" id="btnEliminarTop" data-permiso="Baja">Eliminar</button>
                <button type="button" class="btn btn-light px-4 border" id="btnLimpiar">Limpiar / Nuevo</button>
            </div>
        </form>
    </div>

    <!-- ÁREA DE LA TABLA -->
    <div class="border p-4 rounded shadow-sm">
        <div class="d-flex justify-content-end mb-3 no-print">
            <button class="btn btn-sm btn-outline-secondary me-2" data-permiso="Imprimir" id="btnImprimir">Imprimir</button>
            <button class="btn btn-sm btn-outline-success" data-permiso="Exportar" id="btnExportar">Exportar Excel</button>
        </div>

        <table class="table table-bordered table-hover text-center align-middle" id="tablaSucursales">
            <thead class="table-light">
                <tr>
                    <th>ID</th>
                    <th>Nombre</th>
                    <th>Dirección</th>
                    <th>Empresa</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody>
                <!-- Llenado dinámico -->
            </tbody>
        </table>
    </div>

    <!-- No necesitamos Bootstrap JS porque no hay modales ni menús desplegables aquí -->
    <script src="/js/seguridad.js"></script>
    <script src="/js/sucursales.js"></script>
</body>
</html>
