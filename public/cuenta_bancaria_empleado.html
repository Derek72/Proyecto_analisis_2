<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Cuentas Bancarias de Empleados</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <style>
        @media print {
            .no-print, .btn, th:last-child, td:last-child { display: none !important; }
            body { padding: 0 !important; }
            .shadow-sm { box-shadow: none !important; border: none !important; }
        }
    </style>
</head>
<body class="bg-white p-4">

    <div class="border p-4 rounded shadow-sm mb-4 no-print">
        <h4 class="mb-3 text-secondary border-bottom pb-2">
            <i class="bi bi-bank me-2"></i>Cuentas Bancarias de Empleados
        </h4>

        <form id="formCuenta" class="row g-3 align-items-end mt-2">
            <div class="col-md-3">
                <label class="form-label small text-muted mb-1">Empleado</label>
                <select class="form-select" id="IdEmpleado" required><option value="">Cargando...</option></select>
            </div>
            <div class="col-md-3">
                <label class="form-label small text-muted mb-1">Banco</label>
                <select class="form-select" id="IdBanco" required><option value="">Cargando...</option></select>
            </div>
            <div class="col-md-3">
                <label class="form-label small text-muted mb-1">Número de Cuenta</label>
                <input type="text" class="form-control" id="NumeroDeCuenta" maxlength="50" placeholder="Ej. 001-438715" required>
            </div>
            <div class="col-md-3">
                <div class="form-check form-switch mb-2">
                    <input class="form-check-input" type="checkbox" role="switch" id="Activa" checked>
                    <label class="form-check-label small text-muted" for="Activa">Cuenta activa</label>
                </div>
            </div>

            <div class="col-12 d-flex">
                <button type="button" class="btn btn-primary me-2" id="btnCrear" data-permiso="Alta">Crear</button>
                <button type="button" class="btn btn-primary me-2 d-none" id="btnActualizar" data-permiso="Cambio">Guardar Cambios</button>
                <button type="button" class="btn btn-danger me-2 d-none" id="btnEliminarTop" data-permiso="Baja">Eliminar</button>
                <button type="button" class="btn btn-light border" id="btnLimpiar">Limpiar</button>
                <span class="small text-muted align-self-center ms-3">Un empleado solo puede tener una cuenta activa: al activar una, las demás se desactivan.</span>
            </div>
        </form>
    </div>

    <div class="border p-4 rounded shadow-sm">
        <div class="d-flex flex-wrap justify-content-between align-items-center mb-3 gap-2 no-print">
            <span class="badge bg-secondary py-2 px-3 fs-6" id="badgeContadorCuentas">Mostrando 0 registros</span>
            <div class="d-flex gap-2">
                <button class="btn btn-sm btn-outline-secondary" data-permiso="Imprimir" id="btnImprimir">
                    <i class="bi bi-printer"></i> Imprimir
                </button>
                <button class="btn btn-sm btn-outline-success" data-permiso="Exportar" id="btnExportar">
                    <i class="bi bi-file-excel"></i> Exportar
                </button>
            </div>
        </div>

        <div class="card mb-3 bg-light border-0 no-print">
            <div class="card-body p-3">
                <div class="row g-2 align-items-end">
                    <div class="col-md-5">
                        <label class="form-label small text-muted mb-1 fw-bold">Buscar por ID, Empleado o No. Cuenta:</label>
                        <input type="text" class="form-control form-control-sm" id="filtroTexto" placeholder="Escriba para buscar...">
                    </div>
                    <div class="col-md-3">
                        <label class="form-label small text-muted mb-1 fw-bold">Banco:</label>
                        <select class="form-select form-select-sm" id="filtroBanco">
                            <option value="">Todos los bancos</option>
                        </select>
                    </div>
                    <div class="col-md-2">
                        <label class="form-label small text-muted mb-1 fw-bold">Estado Activa:</label>
                        <select class="form-select form-select-sm" id="filtroActiva">
                            <option value="">Todos</option>
                            <option value="1">Activas</option>
                            <option value="0">Inactivas</option>
                        </select>
                    </div>
                    <div class="col-md-2 d-flex gap-1">
                        <button type="button" class="btn btn-sm btn-outline-secondary w-100" id="btnLimpiarFiltros" title="Limpiar Filtros">
                            <i class="bi bi-x-circle me-1"></i>Limpiar
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <table class="table table-striped table-hover border text-center align-middle" id="tablaCuentas">
            <thead class="table-dark">
                <tr>
                    <th data-columna="IdCuentaBancaria" style="width: 8%; cursor:pointer;" title="Clic para ordenar">ID</th>
                    <th data-columna="NombreEmpleado" style="width: 27%; cursor:pointer;" title="Clic para ordenar">Empleado</th>
                    <th data-columna="NombreBanco" style="width: 20%; cursor:pointer;" title="Clic para ordenar">Banco</th>
                    <th data-columna="NumeroDeCuenta" style="width: 20%; cursor:pointer;" title="Clic para ordenar">Número de Cuenta</th>
                    <th data-columna="Activa" style="width: 10%; cursor:pointer;" title="Clic para ordenar">Activa</th>
                    <th style="width: 15%;">Acciones</th>
                </tr>
            </thead>
            <tbody id="tablaCuentasBody"></tbody>
        </table>
    </div>

    <script src="/js/seguridad.js"></script>
    <script src="/js/cuentaBancariaEmpleado.js"></script>
</body>
</html>
