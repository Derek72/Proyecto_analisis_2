<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Catálogo de Usuarios</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light p-4">
    <div class="border p-4 rounded shadow-sm mb-4 bg-white">
        <h4 class="mb-3 text-secondary border-bottom pb-2">Gestión de Usuarios</h4>
        
        <form id="formUsuario" class="row g-3">
            
            <!-- Datos Personales -->
            <div class="col-md-3">
                <label class="form-label small mb-1">Usuario (ID Login)</label>
                <input type="text" class="form-control" id="IdUsuario" placeholder="Ej. JPEREZ" required>
            </div>
            <div class="col-md-3">
                <label class="form-label small mb-1">Nombre</label>
                <input type="text" class="form-control" id="Nombre" required>
            </div>
            <div class="col-md-3">
                <label class="form-label small mb-1">Apellidos</label>
                <input type="text" class="form-control" id="Apellido" required>
            </div>
            <div class="col-md-3">
                <label class="form-label small mb-1">Fecha de Nacimiento</label>
                <input type="date" class="form-control" id="FechaNacimiento" required>
            </div>

            <!-- Contacto y Cuenta -->
            <div class="col-md-3">
                <label class="form-label small mb-1">Género</label>
                <select id="IdGenero" class="form-select" required><option value="">Cargando...</option></select>
            </div>
            <div class="col-md-4">
                <label class="form-label small mb-1">Correo Electrónico</label>
                <input type="email" class="form-control" id="CorreoElectronico" required>
            </div>
            <div class="col-md-2">
                <label class="form-label small mb-1">Teléfono Móvil</label>
                <input type="text" class="form-control" id="TelefonoMovil" maxlength="30">
            </div>
            <div class="col-md-3">
                <label class="form-label small mb-1">Contraseña</label>
                <input type="password" class="form-control" id="Password" placeholder="Dejar en blanco para no cambiar">
            </div>

            <!-- Seguridad y Configuración -->
            <div class="col-md-3">
                <label class="form-label small mb-1">Fotografía (URL o Base64)</label>
                <input type="text" class="form-control" id="Fotografia">
            </div>
            <div class="col-md-3">
                <label class="form-label small mb-1">Pregunta de Recuperación</label>
                <input type="text" class="form-control" id="Pregunta" required>
            </div>
            <div class="col-md-3">
                <label class="form-label small mb-1">Respuesta</label>
                <input type="text" class="form-control" id="Respuesta" required>
            </div>

            <!-- Asignaciones (Combos) -->
            <div class="col-md-3">
                <label class="form-label small mb-1">Rol</label>
                <select id="IdRole" class="form-select" required><option value="">Cargando...</option></select>
            </div>
            <div class="col-md-3">
                <label class="form-label small mb-1">Estatus</label>
                <select id="IdStatusUsuario" class="form-select" required><option value="">Cargando...</option></select>
            </div>
            <div class="col-md-3">
                <label class="form-label small mb-1">Empresa</label>
                <select id="IdEmpresa" class="form-select" required><option value="">Cargando...</option></select>
            </div>
            <div class="col-md-3">
                <label class="form-label small mb-1">Sucursal</label>
                <select id="IdSucursal" class="form-select" required disabled>
                    <option value="">Seleccione primero una empresa...</option>
                </select>
            </div>

            <!-- Botones -->
            <div class="col-12 text-end mt-4">
                <button type="button" class="btn btn-primary px-4" id="btnGuardar" data-permiso="Alta">Guardar</button>
                <button type="button" class="btn btn-danger px-4 d-none" id="btnEliminarTop" data-permiso="Baja">Eliminar</button>
                <button type="button" class="btn btn-light px-4 border" id="btnLimpiar">Nuevo</button>
            </div>
        </form>
    </div>

    <!-- Tabla -->
    <div class="border p-4 rounded bg-white shadow-sm">
        <table class="table table-striped" id="tablaUsuarios">
            <thead class="table-dark">
                <tr><th>ID</th><th>Nombre</th><th>Correo</th><th>Rol</th><th>Acciones</th></tr>
            </thead>
            <tbody id="tablaUsuariosBody"></tbody>
        </table>
    </div>

    <script src="/js/seguridad.js"></script>
    <script src="/js/usuarios.js"></script>
</body>
</html>
