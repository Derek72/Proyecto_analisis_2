<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Flujo Status Empleado</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <style>
        @media print {
            .no-print, .btn, th:last-child, td:last-child { display: none !important; }
            body { padding: 0 !important; }
            .shadow-sm { box-shadow: none !important; border: none !important; }
        }
    </style>
</head>
<body class="bg-white p-4">

    <div class="border p-4 rounded shadow-sm mb-4 no-print">
        <h4 class="mb-3 text-secondary border-bottom pb-2">
            <i class="bi bi-diagram-3 me-2"></i>Transición y Flujo de Status del Empleado
        </h4>
        
        <form id="formFlujo" class="row g-3 align-items-end mt-2">
            
            <div class="col-md-3">
                <label class="form-label small text-muted mb-1">Status Actual</label>
                <select class="form-select" id="IdStatusActual" required>
                    <option value="">Cargando...</option>
                </select>
            </div>

            <div class="col-md-3">
                <label class="form-label small text-muted mb-1">Status Nuevo (Destino)</label>
                <select class="form-select" id="IdStatusNuevo" required>
                    <option value="">Cargando...</option>
                </select>
            </div>

            <div class="col-md-3">
                <label class="form-label small text-muted mb-1">Nombre / Evento del Cambio</label>
                <input type="text" class="form-control" id="NombreEvento" placeholder="Ej. Suspensión por IGSS, Despido..." required>
            </div>

            <div class="col-md-3 d-flex align-items-end">
                <button type="button" class="btn btn-primary me-2" id="btnCrear" data-permiso="Alta">Crear</button>
                <button type="button" class="btn btn-primary me-2 d-none" id="btnActualizar" data-permiso="Cambio">Guardar Cambios</button>
                <button type="button" class="btn btn-danger me-2 d-none" id="btnEliminarTop" data-permiso="Baja">Eliminar</button>
                <button type="button" class="btn btn-light border" id="btnLimpiar">Limpiar</button>
            </div>
        </form>
    </div>

    <div class="border p-4 rounded shadow-sm">
        <div class="d-flex justify-content-end mb-3 no-print">
            <button class="btn btn-sm btn-outline-secondary me-2" data-permiso="Imprimir" id="btnImprimir">
                <i class="bi bi-printer"></i> Imprimir
            </button>
            <button class="btn btn-sm btn-outline-success" data-permiso="Exportar" id="btnExportar">
                <i class="bi bi-file-excel"></i> Exportar
            </button>
        </div>

        <table class="table table-striped table-hover border text-center align-middle" id="tablaFlujos">
            <thead class="table-dark">
                <tr>
                    <th style="width: 25%;">Status Origen</th>
                    <th style="width: 5%;"></th>
                    <th style="width: 25%;">Status Destino</th>
                    <th style="width: 25%;">Evento / Motivo</th>
                    <th style="width: 20%;">Acciones</th>
                </tr>
            </thead>
            <tbody id="tablaFlujosBody">
                
            </tbody>
        </table>
    </div>

    <script src="/js/seguridad.js"></script>
    <script src="/js/flujoStatusEmpleado.js"></script>
</body>
</html>
