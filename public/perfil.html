<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Mi Perfil</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
</head>
<body class="bg-white p-4">

    <div class="border p-4 rounded shadow-sm" style="max-width: 700px;">
        <h4 class="mb-3 text-secondary border-bottom pb-2">
            <i class="bi bi-person-circle me-2"></i>Mi Perfil
        </h4>

        <div id="mensaje" class="alert d-none text-center small p-2 mb-3" role="alert"></div>

        <form id="formPerfil" class="row g-3">
            <div class="col-md-6">
                <label class="form-label small text-muted mb-1">Usuario</label>
                <input type="text" class="form-control" id="IdUsuario" disabled>
            </div>
            <div class="col-md-6">
                <label class="form-label small text-muted mb-1">Rol</label>
                <input type="text" class="form-control" id="NombreRole" disabled>
            </div>

            <div class="col-md-6">
                <label class="form-label small text-muted mb-1">Nombre</label>
                <input type="text" class="form-control" id="Nombre" required>
            </div>
            <div class="col-md-6">
                <label class="form-label small text-muted mb-1">Apellido</label>
                <input type="text" class="form-control" id="Apellido" required>
            </div>

            <div class="col-md-6">
                <label class="form-label small text-muted mb-1">Fecha de Nacimiento</label>
                <input type="date" class="form-control" id="FechaNacimiento" required>
            </div>
            <div class="col-md-6">
                <label class="form-label small text-muted mb-1">Correo Electrónico</label>
                <input type="email" class="form-control" id="CorreoElectronico">
            </div>

            <div class="col-md-6">
                <label class="form-label small text-muted mb-1">Teléfono Móvil</label>
                <input type="text" class="form-control" id="TelefonoMovil" maxlength="30">
            </div>
            <div class="col-md-6">
                <label class="form-label small text-muted mb-1">Género</label>
                <select id="IdGenero" class="form-select">
                    <option value="">Cargando...</option>
                </select>
            </div>

            <div class="col-12 text-end mt-3">
                <button type="submit" class="btn btn-primary px-4">Guardar Cambios</button>
            </div>
        </form>
    </div>

    <script src="/js/seguridad.js"></script>
    <script src="/js/perfil.js"></script>
</body>
</html>
