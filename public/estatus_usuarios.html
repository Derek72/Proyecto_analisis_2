<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Estatus de Usuario</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <style>
        @media print {
            .no-print, .btn, th:last-child, td:last-child { display: none !important; }
            body { padding: 0 !important; }
            .shadow-sm { box-shadow: none !important; border: none !important; }
        }
    </style>
</head>
<body class="bg-white p-4">

    <!-- ÁREA DEL FORMULARIO -->
    <div class="border p-4 rounded shadow-sm mb-4 no-print">
        <h4 class="mb-3 text-secondary border-bottom pb-2">
            <i class="bi bi-person-badge me-2"></i>Gestión de Estatus de Usuario
        </h4>
        
        <form id="formEstatus" class="row g-3 align-items-end mt-2">
            <input type="hidden" id="IdStatusUsuario">
            
            <div class="col-md-6">
                <label class="form-label small text-muted mb-1">Nombre del Estatus</label>
                <input type="text" class="form-control" id="Nombre" placeholder="Ej. Activo, Bloqueado, Suspendido..." required>
            </div>

            <!-- Botones del Formulario -->
            <div class="col-md-6">
                <button type="button" class="btn btn-primary px-4 me-2" id="btnCrear" data-permiso="Alta">Crear</button>
                <button type="button" class="btn btn-primary px-4 me-2 d-none" id="btnActualizar" data-permiso="Cambio">Guardar Cambios</button>
                <button type="button" class="btn btn-danger px-4 me-2 d-none" id="btnEliminarTop" data-permiso="Baja">Eliminar</button>
                <button type="button" class="btn btn-light px-4 border" id="btnLimpiar">Limpiar / Nuevo</button>
            </div>
        </form>
    </div>

    <!-- ÁREA DE LA TABLA -->
    <div class="border p-4 rounded shadow-sm">
        <div class="d-flex justify-content-end mb-3 no-print">
            <button class="btn btn-sm btn-outline-secondary me-2" data-permiso="Imprimir" id="btnImprimir">
                <i class="bi bi-printer"></i> Imprimir
            </button>
            <button class="btn btn-sm btn-outline-success" data-permiso="Exportar" id="btnExportar">
                <i class="bi bi-file-excel"></i> Exportar
            </button>
        </div>

        <table class="table table-striped table-hover border text-center align-middle" id="tablaEstatus">
            <thead class="table-dark">
                <tr>
                    <th style="width: 15%;">ID</th>
                    <th style="width: 60%;">Nombre</th>
                    <th style="width: 25%;">Acciones</th>
                </tr>
            </thead>
            <tbody id="tablaEstatusBody">
                <!-- Llenado dinámico -->
            </tbody>
        </table>
    </div>

    <script src="/js/seguridad.js"></script>
    <script src="/js/estatus_usuarios.js"></script>
</body>
</html>
