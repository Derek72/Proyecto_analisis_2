<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Personas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <style>
        @media print {
            .no-print, .btn, th:last-child, td:last-child { display: none !important; }
            body { padding: 0 !important; }
            .shadow-sm { box-shadow: none !important; border: none !important; }
        }
    </style>
</head>
<body class="bg-white p-4">

    <div class="border p-4 rounded shadow-sm mb-4 no-print">
        <h4 class="mb-3 text-secondary border-bottom pb-2">
            <i class="bi bi-person-vcard me-2"></i>Gestión de Personas
        </h4>

        <form id="formPersona" class="row g-3 align-items-end mt-2">

            <div class="col-md-4">
                <label class="form-label small text-muted mb-1">Nombre</label>
                <input type="text" class="form-control" id="Nombre" required>
            </div>

            <div class="col-md-4">
                <label class="form-label small text-muted mb-1">Apellido</label>
                <input type="text" class="form-control" id="Apellido" required>
            </div>

            <div class="col-md-4">
                <label class="form-label small text-muted mb-1">Fecha de Nacimiento <span class="text-secondary" style="font-size:0.75rem;">(DD/MM/AAAA)</span></label>
                <input type="date" class="form-control" id="FechaNacimiento" required>
            </div>

            <div class="col-md-4">
                <label class="form-label small text-muted mb-1">Género</label>
                <select class="form-select" id="IdGenero" required>
                    <option value="">Cargando géneros...</option>
                </select>
            </div>

            <div class="col-md-4">
                <label class="form-label small text-muted mb-1">Estado Civil</label>
                <select class="form-select" id="IdEstadoCivil" required>
                    <option value="">Cargando estados civiles...</option>
                </select>
            </div>

            <div class="col-md-4">
                <label class="form-label small text-muted mb-1">Teléfono</label>
                <input type="text" class="form-control" id="Telefono" maxlength="30">
            </div>

            <div class="col-md-6">
                <label class="form-label small text-muted mb-1">Dirección</label>
                <input type="text" class="form-control" id="Direccion">
            </div>

            <div class="col-md-6">
                <label class="form-label small text-muted mb-1">Correo Electrónico</label>
                <input type="email" class="form-control" id="CorreoElectronico">
            </div>

            <div class="col-12 d-flex align-items-end">
                <button type="button" class="btn btn-primary me-2" id="btnCrear" data-permiso="Alta">Crear</button>
                <button type="button" class="btn btn-primary me-2 d-none" id="btnActualizar" data-permiso="Cambio">Guardar Cambios</button>
                <button type="button" class="btn btn-danger me-2 d-none" id="btnEliminarTop" data-permiso="Baja">Eliminar</button>
                <button type="button" class="btn btn-light border" id="btnLimpiar">Limpiar</button>
            </div>
        </form>
    </div>

    <div class="border p-4 rounded shadow-sm">
        <div class="d-flex flex-wrap justify-content-between align-items-center mb-3 gap-2 no-print">
            <span class="badge bg-secondary py-2 px-3 fs-6" id="badgeContadorPersonas">Mostrando 0 registros</span>
            <div class="d-flex gap-2">
                <button class="btn btn-sm btn-outline-secondary" data-permiso="Imprimir" id="btnImprimir">
                    <i class="bi bi-printer"></i> Imprimir
                </button>
                <button class="btn btn-sm btn-outline-success" data-permiso="Exportar" id="btnExportar">
                    <i class="bi bi-file-excel"></i> Exportar
                </button>
            </div>
        </div>

        <div class="card mb-3 bg-light border-0 no-print">
            <div class="card-body p-3">
                <div class="row g-2 align-items-end">
                    <div class="col-md-4">
                        <label class="form-label small text-muted mb-1 fw-bold">Buscar por ID, Nombre o Apellido:</label>
                        <input type="text" class="form-control form-control-sm" id="filtroTexto" placeholder="Escriba para buscar...">
                    </div>
                    <div class="col-md-3">
                        <label class="form-label small text-muted mb-1 fw-bold">Género:</label>
                        <select class="form-select form-select-sm" id="filtroGenero">
                            <option value="">Todos los géneros</option>
                        </select>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label small text-muted mb-1 fw-bold">Estado Civil:</label>
                        <select class="form-select form-select-sm" id="filtroEstadoCivil">
                            <option value="">Todos los estados civiles</option>
                        </select>
                    </div>
                    <div class="col-md-2 d-flex gap-1">
                        <button type="button" class="btn btn-sm btn-outline-secondary w-100" id="btnLimpiarFiltros" title="Limpiar Filtros">
                            <i class="bi bi-x-circle me-1"></i>Limpiar
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <table class="table table-striped table-hover border text-center align-middle" id="tablaPersonas">
            <thead class="table-dark">
                <tr>
                    <th data-columna="IdPersona" style="cursor:pointer;" title="Clic para ordenar">ID</th>
                    <th data-columna="Nombre" style="cursor:pointer;" title="Clic para ordenar">Nombre</th>
                    <th data-columna="Apellido" style="cursor:pointer;" title="Clic para ordenar">Apellido</th>
                    <th data-columna="FechaNacimiento" style="cursor:pointer;" title="Clic para ordenar">Fecha Nacimiento</th>
                    <th data-columna="NombreGenero" style="cursor:pointer;" title="Clic para ordenar">Género</th>
                    <th data-columna="NombreEstadoCivil" style="cursor:pointer;" title="Clic para ordenar">Estado Civil</th>
                    <th data-columna="Telefono" style="cursor:pointer;" title="Clic para ordenar">Teléfono</th>
                    <th data-columna="CorreoElectronico" style="cursor:pointer;" title="Clic para ordenar">Correo</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody id="tablaPersonasBody">
                
            </tbody>
        </table>
    </div>

    <script src="/js/seguridad.js"></script>
    <script src="/js/personas.js"></script>
</body>
</html>
