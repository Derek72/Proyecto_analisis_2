<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Catálogo de Menús</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
</head>
<body class="bg-white p-4">
    <div class="border p-4 rounded shadow-sm mb-4">
        <h4 class="mb-3 text-secondary border-bottom pb-2"><i class="bi bi-list me-2"></i> Gestión de Menús</h4>
        <form id="formMenu" class="row g-3 align-items-end mt-2">
            <input type="hidden" id="IdMenu">
            
            <div class="col-md-3">
                <label class="form-label small text-muted mb-1">Módulo</label>
                <select id="IdModulo" class="form-select" required>
                    <option value="">Cargando módulos...</option>
                </select>
            </div>

            <div class="col-md-4">
                <label class="form-label small text-muted mb-1">Nombre del Menú</label>
                <input type="text" class="form-control" id="Nombre" required>
            </div>

            <div class="col-md-2">
                <label class="form-label small text-muted mb-1">Orden</label>
                <input type="number" class="form-control" id="OrdenMenu" required min="1">
            </div>

            <div class="col-md-3">
                <button type="button" class="btn btn-primary" id="btnCrear" data-permiso="Alta">Crear</button>
                <button type="button" class="btn btn-primary d-none" id="btnActualizar" data-permiso="Cambio">Guardar Cambios</button>
                <button type="button" class="btn btn-danger d-none" id="btnEliminarTop" data-permiso="Baja">Eliminar</button>
                <button type="button" class="btn btn-light border" id="btnLimpiar">Nuevo</button>
            </div>
        </form>
    </div>

    <div class="d-flex justify-content-end mb-3">
        <button class="btn btn-sm btn-outline-secondary me-2" data-permiso="Imprimir" id="btnImprimir">
            <i class="bi bi-printer"></i> Imprimir
        </button>
        <button class="btn btn-sm btn-outline-success" data-permiso="Exportar" id="btnExportar">
            <i class="bi bi-file-excel"></i> Exportar
        </button>
    </div>

    <table class="table table-striped border" id="tablaMenus">
        <thead class="table-dark">
            <tr><th>ID</th><th>Módulo (ID)</th><th>Menú</th><th>Orden</th><th>Acciones</th></tr>
        </thead>
        <tbody id="tablaMenusBody"></tbody>
    </table>

    <script src="/js/seguridad.js"></script>
    <script src="/js/menus.js"></script>
</body>
</html>
