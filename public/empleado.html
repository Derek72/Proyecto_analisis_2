<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Empleados</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <style>
        @media print {
            .no-print, .btn, th:last-child, td:last-child { display: none !important; }
            body { padding: 0 !important; }
            .shadow-sm { box-shadow: none !important; border: none !important; }
        }
        #tablaEmpleados { font-size: 0.85rem; }
    </style>
</head>
<body class="bg-white p-4">

    <div class="border p-4 rounded shadow-sm mb-4 no-print">
        <h4 class="mb-3 text-secondary border-bottom pb-2">
            <i class="bi bi-person-badge me-2"></i>Gestión de Empleados
        </h4>

        <form id="formEmpleado" class="row g-3 mt-1">
            <div class="col-md-3">
                <label class="form-label small text-muted mb-1">Persona</label>
                <select class="form-select" id="IdPersona" required><option value="">Cargando...</option></select>
            </div>
            <div class="col-md-3">
                <label class="form-label small text-muted mb-1">Sucursal</label>
                <select class="form-select" id="IdSucursal" required><option value="">Cargando...</option></select>
            </div>
            <div class="col-md-3">
                <label class="form-label small text-muted mb-1">Puesto</label>
                <select class="form-select" id="IdPuesto" required><option value="">Cargando...</option></select>
            </div>
            <div class="col-md-3">
                <label class="form-label small text-muted mb-1">Status del Empleado</label>
                <select class="form-select" id="IdStatusEmpleado" required><option value="">Cargando...</option></select>
            </div>

            <div class="col-md-3">
                <label class="form-label small text-muted mb-1">Fecha de Contratación</label>
                <input type="date" class="form-control" id="FechaContratacion" required>
            </div>
            <div class="col-md-3">
                <label class="form-label small text-muted mb-1">Sueldo Base (Q)</label>
                <input type="number" step="0.01" min="0" class="form-control" id="IngresoSueldoBase" required>
            </div>
            <div class="col-md-3">
                <label class="form-label small text-muted mb-1">Bonificación Decreto (Q)</label>
                <input type="number" step="0.01" min="0" class="form-control" id="IngresoBonificacionDecreto" value="250" required>
            </div>
            <div class="col-md-3">
                <label class="form-label small text-muted mb-1">Otros Ingresos (Q)</label>
                <input type="number" step="0.01" min="0" class="form-control" id="IngresoOtrosIngresos" value="0" required>
            </div>

            <div class="col-md-3">
                <label class="form-label small text-muted mb-1">Descuento IGSS (Q)</label>
                <input type="number" step="0.01" min="0" class="form-control" id="DescuentoIgss" value="0" required>
                <div class="form-text">Se sugiere 4.83% del sueldo base.</div>
            </div>
            <div class="col-md-3">
                <label class="form-label small text-muted mb-1">Descuento ISR (Q)</label>
                <input type="number" step="0.01" min="0" class="form-control" id="DescuentoIsr" value="0" required>
            </div>
            <div class="col-md-3">
                <label class="form-label small text-muted mb-1">Descuento por Inasistencias (Q)</label>
                <input type="number" step="0.01" min="0" class="form-control" id="DescuentoInasistencias" value="0" required>
            </div>

            <div class="col-md-3 d-flex align-items-end">
                <button type="button" class="btn btn-primary me-2" id="btnCrear" data-permiso="Alta">Crear</button>
                <button type="button" class="btn btn-primary me-2 d-none" id="btnActualizar" data-permiso="Cambio">Guardar Cambios</button>
                <button type="button" class="btn btn-danger me-2 d-none" id="btnEliminarTop" data-permiso="Baja">Eliminar</button>
                <button type="button" class="btn btn-light border" id="btnLimpiar">Limpiar</button>
            </div>
        </form>
    </div>

    <div class="border p-4 rounded shadow-sm">
        <div class="d-flex justify-content-end mb-3 no-print">
            <button class="btn btn-sm btn-outline-secondary me-2" data-permiso="Imprimir" id="btnImprimir">
                <i class="bi bi-printer"></i> Imprimir
            </button>
            <button class="btn btn-sm btn-outline-success" data-permiso="Exportar" id="btnExportar">
                <i class="bi bi-file-excel"></i> Exportar
            </button>
        </div>

        <div class="table-responsive">
            <table class="table table-striped table-hover border text-center align-middle" id="tablaEmpleados">
                <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>Empleado</th>
                        <th>Sucursal</th>
                        <th>Puesto</th>
                        <th>Status</th>
                        <th>Contratación</th>
                        <th>Sueldo Base</th>
                        <th>Bonif. Decreto</th>
                        <th>Otros Ingresos</th>
                        <th>IGSS</th>
                        <th>ISR</th>
                        <th>Desc. Inasist.</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="tablaEmpleadosBody"></tbody>
            </table>
        </div>
    </div>

    <script src="/js/seguridad.js"></script>
    <script src="/js/empleado.js"></script>
</body>
</html>
