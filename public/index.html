<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Login del Sistema</title>
    <!-- Carga de Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex justify-content-center align-items-center vh-100">
    <div class="card p-4 shadow-sm" style="width: 100%; max-width: 400px;">
        <div class="text-center mb-4 border rounded p-2 logo-placeholder">LOGO</div>
        <h5 class="text-muted mb-3 border-bottom pb-2">Sign In</h5>
        
        <!-- Contenedor para mensajes de error (oculto por defecto) -->
<div id="mensajeError" class="alert alert-danger d-none text-center small p-2 mb-3" role="alert">
</div>
        <form id="loginForm">
            <div class="mb-3">
                <label class="form-label text-secondary small">User Name:</label>
                <input type="text" id="username" class="form-control" placeholder="john-wick" required>
            </div>
            <div class="mb-4">
                <label class="form-label text-secondary small">Password:</label>
                <input type="password" id="password" class="form-control" placeholder="********" required>
            </div>
            <button type="submit" class="btn btn-info text-white w-100 fw-bold mb-2">SIGN IN</button>
        </form>
        
        <a href="/recuperar.html" class="text-info text-decoration-none small">Forgot Password?</a>
    </div>
    <script src="/js/logo.js"></script>
    <script src="/js/app.js"></script>
</body>
</html>
