<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Asignación de Opciones a un Rol</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <style>
        @media print {
            .no-print, .btn, th:last-child, td:last-child { display: none !important; }
            body { padding: 0 !important; }
            .shadow-sm { box-shadow: none !important; border: none !important; }
        }
        .form-check-input { cursor: pointer; width: 1.2em; height: 1.2em; }
        #tablaPermisosBody tr.fila-modificada { background-color: #fff8e1; }
    </style>
</head>
<body class="bg-white p-4">

    <div class="border p-4 rounded shadow-sm mb-4 no-print">
        <h4 class="mb-3 text-secondary border-bottom pb-2">
            <i class="bi bi-key me-2"></i>Asignación de Opciones a un Rol
        </h4>

        <div class="row g-3 align-items-end mt-2">
            <div class="col-md-5">
                <label class="form-label small text-muted mb-1">Rol</label>
                <select id="IdRole" class="form-select">
                    <option value="">Cargando roles...</option>
                </select>
            </div>

            <div class="col-md-5">
                <label class="form-label small text-muted mb-1">Módulo</label>
                <select id="IdModulo" class="form-select">
                    <option value="">Cargando módulos...</option>
                </select>
            </div>

            <div class="col-md-2">
                <button type="button" class="btn btn-primary w-100" id="btnGuardar" data-permiso="Cambio" disabled>
                    <i class="bi bi-save"></i> Guardar
                </button>
            </div>
        </div>
    </div>

    <div class="border p-4 rounded shadow-sm">
        <div class="d-flex justify-content-between align-items-center mb-3 no-print">
            <small class="text-muted" id="mensajeEstado">Selecciona un Rol y un Módulo para ver sus opciones.</small>
            <div>
                <button class="btn btn-sm btn-outline-secondary me-2" data-permiso="Imprimir" id="btnImprimir">
                    <i class="bi bi-printer"></i> Imprimir
                </button>
                <button class="btn btn-sm btn-outline-success" data-permiso="Exportar" id="btnExportar">
                    <i class="bi bi-file-excel"></i> Exportar
                </button>
            </div>
        </div>

        <table class="table table-striped table-hover border text-center align-middle" id="tablaPermisos">
            <thead class="table-dark">
                <tr>
                    <th class="text-start">Opción</th>
                    <th>Consultar</th>
                    <th>Alta</th>
                    <th>Baja</th>
                    <th>Cambio</th>
                    <th>Imprimir</th>
                    <th>Exportar</th>
                </tr>
            </thead>
            <tbody id="tablaPermisosBody">
                <tr>
                    <td colspan="7" class="text-muted py-4">No hay datos que mostrar todavía.</td>
                </tr>
            </tbody>
        </table>
    </div>

    <script src="/js/seguridad.js"></script>
    <script src="/js/permisos.js"></script>
</body>
</html>
