<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Documentos de Personas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <style>
        @media print {
            .no-print, .btn, th:last-child, td:last-child { display: none !important; }
            body { padding: 0 !important; }
            .shadow-sm { box-shadow: none !important; border: none !important; }
        }
    </style>
</head>
<body class="bg-white p-4">

    <div class="border p-4 rounded shadow-sm mb-4 no-print">
        <h4 class="mb-3 text-secondary border-bottom pb-2">
            <i class="bi bi-file-earmark-person me-2"></i>Gestión de Documentos de Personas
        </h4>

        <form id="formDocumentoPersona" class="row g-3 align-items-end mt-2">

            <div class="col-md-4">
                <label class="form-label small text-muted mb-1">Persona</label>
                <select class="form-select" id="IdPersona" required>
                    <option value="">Cargando personas...</option>
                </select>
            </div>

            <div class="col-md-4">
                <label class="form-label small text-muted mb-1">Tipo de Documento</label>
                <select class="form-select" id="IdTipoDocumento" required>
                    <option value="">Cargando tipos de documento...</option>
                </select>
            </div>

            <div class="col-md-4">
                <label class="form-label small text-muted mb-1">Número de Documento</label>
                <input type="text" class="form-control" id="NoDocumento" required>
            </div>

            <div class="col-12 d-flex align-items-end">
                <button type="button" class="btn btn-primary me-2" id="btnCrear" data-permiso="Alta">Crear</button>
                <button type="button" class="btn btn-primary me-2 d-none" id="btnActualizar" data-permiso="Cambio">Guardar Cambios</button>
                <button type="button" class="btn btn-danger me-2 d-none" id="btnEliminarTop" data-permiso="Baja">Eliminar</button>
                <button type="button" class="btn btn-light border" id="btnLimpiar">Limpiar</button>
            </div>
            <div class="col-12 no-print">
                <small class="text-muted" id="avisoEdicion" style="display:none;">
                    La Persona y el Tipo de Documento no se pueden cambiar en edición (forman la llave del registro). Si necesitas cambiarlos, elimina este documento y crea uno nuevo.
                </small>
            </div>
        </form>
    </div>

    <div class="border p-4 rounded shadow-sm">
        <div class="d-flex flex-wrap justify-content-between align-items-center mb-3 gap-2 no-print">
            <span class="badge bg-secondary py-2 px-3 fs-6" id="badgeContadorDocs">Mostrando 0 registros</span>
            <div class="d-flex gap-2">
                <button class="btn btn-sm btn-outline-secondary" data-permiso="Imprimir" id="btnImprimir">
                    <i class="bi bi-printer"></i> Imprimir
                </button>
                <button class="btn btn-sm btn-outline-success" data-permiso="Exportar" id="btnExportar">
                    <i class="bi bi-file-excel"></i> Exportar
                </button>
            </div>
        </div>

        <div class="card mb-3 bg-light border-0 no-print">
            <div class="card-body p-3">
                <div class="row g-2 align-items-end">
                    <div class="col-md-6">
                        <label class="form-label small text-muted mb-1 fw-bold">Buscar por Persona o No. Documento:</label>
                        <input type="text" class="form-control form-control-sm" id="filtroTexto" placeholder="Escriba para buscar...">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label small text-muted mb-1 fw-bold">Tipo de Documento:</label>
                        <select class="form-select form-select-sm" id="filtroTipoDoc">
                            <option value="">Todos los tipos</option>
                        </select>
                    </div>
                    <div class="col-md-2 d-flex gap-1">
                        <button type="button" class="btn btn-sm btn-outline-secondary w-100" id="btnLimpiarFiltros" title="Limpiar Filtros">
                            <i class="bi bi-x-circle me-1"></i>Limpiar
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <table class="table table-striped table-hover border text-center align-middle" id="tablaDocumentos">
            <thead class="table-dark">
                <tr>
                    <th data-columna="NombrePersona" style="cursor:pointer;" title="Clic para ordenar">Persona</th>
                    <th data-columna="NombreTipoDocumento" style="cursor:pointer;" title="Clic para ordenar">Tipo de Documento</th>
                    <th data-columna="NoDocumento" style="cursor:pointer;" title="Clic para ordenar">Número de Documento</th>
                    <th style="width: 20%;">Acciones</th>
                </tr>
            </thead>
            <tbody id="tablaDocumentosBody">
                
            </tbody>
        </table>
    </div>

    <script src="/js/seguridad.js"></script>
    <script src="/js/documento_persona.js"></script>
</body>
</html>
