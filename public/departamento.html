<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Departamentos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <style>
        @media print {
            .no-print, .btn, th:last-child, td:last-child { display: none !important; }
            body { padding: 0 !important; }
            .shadow-sm { box-shadow: none !important; border: none !important; }
        }
    </style>
</head>
<body class="bg-white p-4">

    <div class="border p-4 rounded shadow-sm mb-4 no-print">
        <h4 class="mb-3 text-secondary border-bottom pb-2">
            <i class="bi bi-building me-2"></i>Gestión de Departamentos
        </h4>
        
        <form id="formDepartamento" class="row g-3 align-items-end mt-2">
            
            <div class="col-md-4">
                <label class="form-label small text-muted mb-1">Empresa</label>
                <select class="form-select" id="IdEmpresa" required>
                    <option value="">Cargando empresas...</option>
                </select>
            </div>

            <div class="col-md-4">
                <label class="form-label small text-muted mb-1">Nombre del Departamento</label>
                <input type="text" class="form-control" id="Nombre" placeholder="Ej. Recursos Humanos, Ventas..." required>
            </div>

            <div class="col-md-4 d-flex align-items-end">
                <button type="button" class="btn btn-primary me-2" id="btnCrear" data-permiso="Alta">Crear</button>
                <button type="button" class="btn btn-primary me-2 d-none" id="btnActualizar" data-permiso="Cambio">Guardar Cambios</button>
                <button type="button" class="btn btn-danger me-2 d-none" id="btnEliminarTop" data-permiso="Baja">Eliminar</button>
                <button type="button" class="btn btn-light border" id="btnLimpiar">Limpiar</button>
            </div>
        </form>
    </div>

    <div class="border p-4 rounded shadow-sm">
        <div class="d-flex justify-content-end mb-3 no-print">
            <button class="btn btn-sm btn-outline-secondary me-2" data-permiso="Imprimir" id="btnImprimir">
                <i class="bi bi-printer"></i> Imprimir
            </button>
            <button class="btn btn-sm btn-outline-success" data-permiso="Exportar" id="btnExportar">
                <i class="bi bi-file-excel"></i> Exportar
            </button>
        </div>

        <table class="table table-striped table-hover border text-center align-middle" id="tablaDepartamentos">
            <thead class="table-dark">
                <tr>
                    <th style="width: 10%;">ID</th>
                    <th style="width: 35%;">Nombre del Departamento</th>
                    <th style="width: 35%;">Empresa</th>
                    <th style="width: 20%;">Acciones</th>
                </tr>
            </thead>
            <tbody id="tablaDepartamentosBody">
                
            </tbody>
        </table>
    </div>

    <script src="/js/seguridad.js"></script>
    <script src="/js/departamento.js"></script>
</body>
</html>
