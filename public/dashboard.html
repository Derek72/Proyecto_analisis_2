<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consola del Sistema</title>
    <!-- GUARD DE SESIÓN: si no hay usuario logueado, fuera de aquí antes de mostrar nada.
         Corre en la carga inicial Y en 'pageshow' (cubre cuando el navegador restaura
         esta página desde el historial con el botón Atrás/Adelante). -->
    <script>
        function validarSesionDashboard() {
            if (!localStorage.getItem('usuario')) {
                window.location.replace('/');
            }
        }
        validarSesionDashboard();
        window.addEventListener('pageshow', validarSesionDashboard);
    </script>
    <!-- CSS de Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Iconos de Bootstrap -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <style>
        /* Ajustamos la altura para que ocupe toda la pantalla */
        body, html { height: 100%; margin: 0; overflow: hidden; }
        .sidebar { width: 250px; background-color: #f8f9fa; overflow-y: auto; }
        .main-content { flex-grow: 1; overflow-y: auto; background-color: #ffffff; }
        .nav-link { color: #333; font-size: 0.95rem; }
        .nav-link:hover { background-color: #e9ecef; border-radius: 4px; }
        .menu-title { font-size: 1rem; color: #000; cursor: default; }
    </style>
</head>
<body class="d-flex flex-column">

    <!-- HEADER -->
    <header class="d-flex justify-content-between align-items-center p-3 border-bottom bg-white shadow-sm">
        <!-- Logo -->
 <div class="border p-2 px-4 logo-placeholder">
    LOGO
</div>
        
        <!-- Icono de Usuario y Menú -->
        <div class="dropdown">
            <button class="btn btn-light dropdown-toggle border-0" type="button" data-bs-toggle="dropdown">
                <i class="bi bi-person fs-3"></i>
            </button>
            <ul class="dropdown-menu dropdown-menu-end shadow">
                <li><a class="dropdown-item" href="/perfil.html" target="contentFrame">Perfil</a></li>
                <li><a class="dropdown-item" href="/cambiar_password.html" target="contentFrame">Cambiar Password</a></li>
                <li><hr class="dropdown-divider"></li>
                <li><button class="dropdown-item text-danger" id="btnLogout">Cerrar Sesión</button></li>
            </ul>
        </div>
    </header>

    <!-- CUERPO (Sidebar + Main Content) -->
    <div class="d-flex flex-grow-1 overflow-hidden">
        
        <!-- SIDEBAR -->
        <!-- El contenido se genera dinámicamente en construirMenuLateral() (public/js/seguridad.js)
             a partir de usuario.permisos (localStorage), respetando 3 niveles: Módulo > Menú > Opción.
             Solo aparecen los nodos donde el rol del usuario tiene permiso de Consultar. -->
        <aside class="sidebar border-end p-3 shadow-sm">
            <div id="menuLateral">
                <div class="text-muted small px-2">Cargando menú...</div>
            </div>
        </aside>

        <!-- ÁREA CENTRAL (El recuadro con la 'X' en tu diagrama) -->
        <!-- ÁREA CENTRAL -->
<main class="main-content p-0"> 
    <iframe name="contentFrame" src="about:blank" style="width: 100%; height: 100%; border: none;"></iframe>
</main>

    </div>

    <!-- JS de Bootstrap para que el menú del usuario y los colapsables del sidebar se desplieguen -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/seguridad.js"></script>

    <script>
        document.getElementById('btnLogout').addEventListener('click', () => {
            localStorage.removeItem('usuario');
            window.location.href = '/';
        });

        // Construye el menú lateral de 3 niveles según los permisos del rol
        construirMenuLateral();
    </script>
    <script src="/js/logo.js"></script>
</body>
</html>
