<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crear Usuario</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

  <!-- Barra de navegación -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
      <span class="navbar-brand">Proyecto Análisis</span>
      <div class="d-flex align-items-center text-white">
        <a href="dashboard.html" class="btn btn-sm btn-outline-light">Volver al Dashboard</a>
      </div>
    </div>
  </nav>

  <!-- Contenedor del Formulario -->
  <div class="container mt-5 mb-5">
    <div class="row justify-content-center">
      <div class="col-lg-8">
        <div class="card shadow">
          <div class="card-header bg-success text-white">
            <h4 class="mb-0">Registrar Nuevo Usuario</h4>
          </div>
          <div class="card-body p-4">
            
            <div id="alerta-crear"></div>

            <form id="crearUsuarioForm">
              <div class="row">
                
                <div class="col-md-6 mb-3">
                  <label class="form-label">Usuario (ID)</label>
                  <input type="text" class="form-control" id="IdUsuario" placeholder="Ej: jlopez" required>
                </div>
                <div class="col-md-6 mb-3">
                  <label class="form-label">Contraseña</label>
                  <input type="password" class="form-control" id="Password" required>
                </div>

                <div class="col-md-6 mb-3">
                  <label class="form-label">Nombre</label>
                  <input type="text" class="form-control" id="Nombre" required>
                </div>
                <div class="col-md-6 mb-3">
                  <label class="form-label">Apellido</label>
                  <input type="text" class="form-control" id="Apellido" required>
                </div>

                <div class="col-md-6 mb-3">
                  <label class="form-label">Fecha de Nacimiento</label>
                  <input type="date" class="form-control" id="FechaNacimiento" required>
                </div>
                <div class="col-md-6 mb-3">
                  <label class="form-label">Correo Electrónico</label>
                  <input type="email" class="form-control" id="CorreoElectronico" required>
                </div>

                <div class="col-md-6 mb-3">
                  <label class="form-label">Teléfono Móvil</label>
                  <input type="text" class="form-control" id="TelefonoMovil">
                </div>
                
                <div class="col-md-6 mb-3">
                  <label class="form-label">Género</label>
                  <select class="form-select" id="IdGenero" required>
                    <option value="">Seleccione...</option>
                    <option value="1">Masculino</option>
                    <option value="2">Femenino</option>
                  </select>
                </div>

                <div class="col-md-6 mb-3">
                  <label class="form-label">Rol</label>
                  <select class="form-select" id="IdRole" required>
                    <option value="">Seleccione...</option>
                    <option value="1">Administrador</option>
                    <option value="2">Usuario Estándar</option>
                  </select>
                </div>
                
                <div class="col-md-6 mb-3">
                  <label class="form-label">Sucursal</label>
                  <select class="form-select" id="IdSucursal" required>
                    <option value="">Seleccione...</option>
                    <option value="1">Oficinas Centrales</option>
                    <option value="2">Sucursal Norte</option>
                  </select>
                </div>

                <div class="col-md-6 mb-3">
                  <label class="form-label">Pregunta de Seguridad</label>
                  <input type="text" class="form-control" id="Pregunta" placeholder="Ej: Nombre de tu primera mascota" required>
                </div>
                <div class="col-md-6 mb-4">
                  <label class="form-label">Respuesta de Seguridad</label>
                  <input type="text" class="form-control" id="Respuesta" required>
                </div>
              </div>

              <button type="submit" class="btn btn-success w-100 fw-bold">Guardar Usuario</button>
            </form>

          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="crear-usuario.js"></script>
</body>
</html>
