<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Cambiar Contraseña</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
</head>
<body class="bg-white p-4">

    <div class="border p-4 rounded shadow-sm" style="max-width: 500px;">
        <h4 class="mb-3 text-secondary border-bottom pb-2">
            <i class="bi bi-key me-2"></i>Cambiar Contraseña
        </h4>

        <div id="mensaje" class="alert d-none text-center small p-2 mb-3" role="alert"></div>

        <form id="formPassword" class="row g-3">
            <div class="col-12">
                <label class="form-label small text-muted mb-1">Contraseña actual</label>
                <input type="password" class="form-control" id="PasswordActual" required>
            </div>
            <div class="col-12">
                <label class="form-label small text-muted mb-1">Nueva contraseña</label>
                <input type="password" class="form-control" id="PasswordNueva" required minlength="6">
            </div>
            <div class="col-12">
                <label class="form-label small text-muted mb-1">Confirmar nueva contraseña</label>
                <input type="password" class="form-control" id="PasswordConfirmar" required minlength="6">
            </div>

            <div class="col-12 text-end mt-3">
                <button type="submit" class="btn btn-primary px-4">Cambiar Contraseña</button>
            </div>
        </form>
    </div>

    <script src="/js/cambiar_password.js"></script>
</body>
</html>
